name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python -m pip install -r requirements-dev.txt
        working-directory: backend
      - run: python -m pytest tests -q
        working-directory: backend
      - name: Package Windows application
        shell: pwsh
        working-directory: backend
        run: python -m PyInstaller --clean --noconfirm --onedir --name VacuumInterlock --collect-all uvicorn --collect-all fastapi --collect-all cryptography --add-data "../frontend/dist;frontend/dist" run.py
      - name: Smoke test packaged server
        shell: pwsh
        run: |
          $env:VACUUM_INTERLOCK_DATA_DIR = Join-Path $env:RUNNER_TEMP 'vacuum-interlock-smoke'
          $app = Join-Path $env:GITHUB_WORKSPACE 'backend\dist\VacuumInterlock\VacuumInterlock.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'vacuum-interlock-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'vacuum-interlock-stderr.log'
          $process = Start-Process -FilePath $app -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8770/api/health' -TimeoutSec 2
                $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8770/' -TimeoutSec 2
                if ($health.ok -and $page.Content.Contains('真空联锁控制台')) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              $details = @()
              if (Test-Path $stdout) { $details += Get-Content $stdout -Raw }
              if (Test-Path $stderr) { $details += Get-Content $stderr -Raw }
              throw "Packaged server did not serve the health API and frontend.`n$($details -join [Environment]::NewLine)"
            }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
          }
